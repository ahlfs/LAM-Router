name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Publish-loop regression test
        # Guards the release loop's failure semantics (one npm-refused package
        # name must not block the whole release) without needing a token.
        run: bash scripts/tests/publish-loop.test.sh

      - name: Build
        run: go build -ldflags="-s -w" -o /tmp/lamrouter ./cmd/lamrouter/
