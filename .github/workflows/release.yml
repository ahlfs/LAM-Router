name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build all platforms
        run: make cross

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Try to extract section for this version tag from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/## \\[$TAG\\]/{flag=1; next} /## \\[v/{flag=0} flag" CHANGELOG.md)
          fi
          if [ -n "$NOTES" ]; then
            echo "$NOTES" > /tmp/changelog.md
          else
            # Fallback to git log
            PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -2 | tail -1)
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF_NAME}" ]; then
              LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
            else
              LOG=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREV_TAG}..${GITHUB_REF_NAME})
            fi
            echo "$LOG" > /tmp/changelog.md
          fi
          cat /tmp/changelog.md

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lam-router-linux-amd64
            lam-router-linux-arm64
            lam-router-darwin-amd64
            lam-router-darwin-arm64
            lam-router-windows-amd64.exe
          body_path: /tmp/changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
