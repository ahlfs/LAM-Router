name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      # Full history: CHANGELOG extraction and the previous-tag diff need the tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build all platforms
        run: make cross

      - name: Generate checksums
        run: |
          sha256sum \
            lam-router-linux-amd64 \
            lam-router-linux-arm64 \
            lam-router-darwin-amd64 \
            lam-router-darwin-arm64 \
            lam-router-windows-amd64.exe > checksums.txt
          cat checksums.txt

      - name: Extract release notes
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/## \\[$TAG\\]/{flag=1; next} /## \\[v/{flag=0} flag" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -2 | tail -1)
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges)
            else
              NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..${TAG}")
            fi
          fi
          {
            echo "$NOTES"
            echo
            echo "### Install / update"
            echo '```bash'
            echo "npm i -g lam-router@latest"
            echo "pm2 restart lamrouter   # or: systemctl restart lam-router"
            echo '```'
            echo "Prebuilt archives and \`checksums.txt\` are attached to this release."
          } > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lam-router-linux-amd64
            lam-router-linux-arm64
            lam-router-darwin-amd64
            lam-router-darwin-arm64
            lam-router-windows-amd64.exe
            checksums.txt
          body_path: /tmp/changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: signs the published tarballs against this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Fail with an actionable message instead of an E401 deep inside the publish loop.
      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Repository secret NPM_TOKEN is missing. Create a Granular Access Token (All packages, read+write, 2FA bypass) and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # npm reads $HOME/.npmrc only when publishing from a sub-package directory.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"
          npm whoami

      # Before spending a publish: the loop must keep going past a package name
      # npm's screening refuses, while still aborting on real errors.
      - name: Publish-loop regression test
        run: bash scripts/tests/publish-loop.test.sh

      - name: Publish all NPM packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: ./scripts/build-npm.sh --publish

  verify-npm:
    name: Verify published npm channel
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Regression guard for the 1.8.5 failure: the registry served a binary
      # that no longer matched the repository. This job downloads what npm
      # actually serves and refuses to pass if it is stale.
      - name: Verify registry artifacts
        run: ./scripts/build-npm.sh --verify
