<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LAM-Router Dashboard</title>

        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="manifest" href="/site.webmanifest" />

        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("lamrouter-theme") || localStorage.getItem("srouter-theme");
                    var theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : window.matchMedia("(prefers-color-scheme: light)").matches
                              ? "light"
                              : "dark";
                    var root = document.documentElement;
                    root.classList.toggle("dark", theme === "dark");
                    root.style.colorScheme = theme;
                } catch (e) {}
            })();
        </script>
      <script type="module" crossorigin src="/assets/index-RPl1VWtk.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-BU7vve9c.css">
    </head>

        <div id="root"></div>
    </body>
