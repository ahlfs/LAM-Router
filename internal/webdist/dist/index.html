        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("lamrouter-theme") || localStorage.getItem("srouter-theme");
                    var lightThemes = [
                        "dark-minimalist-light", "claude-nous-light", "matrix-light",
                        "claude-official-light", "claude-classic-light", "claude-slate-light",
                        "scifi-light", "dracula-light", "discord-nitro-light",
                        "arctic-light", "synthwave-light", "biolab-light",
                        "monokai-light", "tokyonight-light", "crimson-light",
                        "deusex-light", "highcontrast-light", "light"
                    ];
                    var theme = stored || "dark-minimalist";
                    var isLight = lightThemes.indexOf(theme) !== -1;
                    var root = document.documentElement;
                    root.setAttribute("data-theme", theme);
                    root.classList.toggle("dark", !isLight);
                    root.classList.toggle("light", isLight);
                    root.style.colorScheme = isLight ? "light" : "dark";
                } catch (e) {}
            })();
        </script>
